<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#06070d" />
<title>Neon TikTok Downloader</title>

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- Video.js -->
<link rel="stylesheet" href="https://vjs.zencdn.net/8.16.1/video-js.css" />

<style>
  :root{
    --bg:#06070d;
    --surface:#0e1018;
    --edge-hi:rgba(255,255,255,.035);
    --text:#e8ecf5;
    --text-dim:#7a8099;
    --cyan:#00e5ff;
    --magenta:#ff2bd6;
    --purple:#a855f7;
    --green:#22ff88;
    --r:18px;
    --dur:.28s;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  html{overscroll-behavior:none}
  body{
    background:var(--bg);
    color:var(--text);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* ── ambient background ─────────────────────────────── */
  .bg-grid,.bg-glow{position:fixed;pointer-events:none;z-index:0}
  .bg-grid{
    inset:-2px;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 78%);
  }
  .bg-glow{
    width:60vmax;height:60vmax;border-radius:50%;
    filter:blur(90px);opacity:.28;
    animation:float 18s ease-in-out infinite;
  }
  .bg-glow-1{top:-24vmax;left:-22vmax;background:radial-gradient(circle,var(--cyan),transparent 62%)}
  .bg-glow-2{bottom:-26vmax;right:-24vmax;background:radial-gradient(circle,var(--magenta),transparent 62%);animation-delay:-9s}
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(3vmax,-3vmax,0) scale(1.14)}
  }

  /* ── header ─────────────────────────────────────────── */
  header{
    flex:0 0 auto;
    position:relative;z-index:2;
    padding:calc(14px + var(--safe-t)) 16px 12px;
    width:100%;max-width:560px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:44px;height:44px;flex:0 0 44px;
    display:grid;place-items:center;
    font-size:18px;border-radius:14px;color:var(--cyan);
    background:linear-gradient(145deg,#151a27,#0a0d15);
    box-shadow:
      6px 6px 16px rgba(0,0,0,.75),
      -4px -4px 12px rgba(255,255,255,.03),
      inset 0 0 0 1px rgba(255,255,255,.05),
      0 0 26px rgba(0,229,255,.3);
    animation:pulseLogo 3.4s ease-in-out infinite;
  }
  @keyframes pulseLogo{
    0%,100%{box-shadow:6px 6px 16px rgba(0,0,0,.75),-4px -4px 12px rgba(255,255,255,.03),inset 0 0 0 1px rgba(255,255,255,.05),0 0 26px rgba(0,229,255,.3)}
    50%{box-shadow:6px 6px 16px rgba(0,0,0,.75),-4px -4px 12px rgba(255,255,255,.03),inset 0 0 0 1px rgba(255,255,255,.08),0 0 46px rgba(0,229,255,.55)}
  }
  h1{
    margin:0;font-size:17px;font-weight:800;letter-spacing:.02em;
    background:linear-gradient(92deg,var(--cyan) 0%,#fff 45%,var(--magenta) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 12px rgba(0,229,255,.35));
  }
  header p{margin:2px 0 0;color:var(--text-dim);font-size:11.5px;letter-spacing:.06em}

  /* ── main ───────────────────────────────────────────── */
  main{
    flex:1 1 0;
    min-height:0;
    overflow:hidden;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
  }
  .scroll{
    flex:1 1 auto;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
    width:100%;max-width:560px;margin:0 auto;
    padding:4px 16px 24px;
    display:flex;flex-direction:column;gap:14px;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ── footer ─────────────────────────────────────────── */
  footer{
    flex:0 0 auto;
    position:relative;z-index:2;
    text-align:center;
    padding:10px 16px calc(12px + var(--safe-b));
    color:#4d5470;font-size:10.5px;letter-spacing:.08em;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  footer i{font-size:9px;color:var(--magenta)}

  /* ── cards ──────────────────────────────────────────── */
  .card{
    position:relative;
    background:linear-gradient(145deg,#131826,#0a0d15);
    border-radius:var(--r);
    padding:16px;
    box-shadow:
      8px 8px 22px rgba(0,0,0,.72),
      -6px -6px 18px rgba(255,255,255,.028),
      inset 0 0 0 1px rgba(255,255,255,.045);
  }
  .card::before{
    content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;
    background:linear-gradient(140deg,rgba(0,229,255,.35),transparent 40%,transparent 60%,rgba(255,43,214,.35));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    pointer-events:none;opacity:.7;
  }

  /* ── field ──────────────────────────────────────────── */
  .field{
    position:relative;display:flex;align-items:center;gap:11px;
    background:#080a11;border-radius:14px;padding:0 14px;
    box-shadow:
      inset 4px 4px 10px rgba(0,0,0,.85),
      inset -2px -2px 6px rgba(255,255,255,.025),
      inset 0 0 0 1px rgba(255,255,255,.04);
    transition:box-shadow var(--dur),background var(--dur);
  }
  .field:focus-within{
    background:#0a0e18;
    box-shadow:
      inset 4px 4px 10px rgba(0,0,0,.85),
      inset -2px -2px 6px rgba(255,255,255,.03),
      inset 0 0 0 1px rgba(0,229,255,.45),
      0 0 0 4px rgba(0,229,255,.08),
      0 0 26px rgba(0,229,255,.22);
  }
  .field > i{flex:0 0 auto;font-size:15px;color:var(--text-dim);transition:color var(--dur)}
  .field:focus-within > i{color:var(--cyan)}
  .field input{
    flex:1;min-width:0;background:transparent;border:0;outline:0;
    color:var(--text);font:inherit;padding:16px 0;font-size:16px;
  }
  .field input::placeholder{color:#4d5470}

  /* ── buttons ────────────────────────────────────────── */
  .btn{
    position:relative;display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;padding:16px 18px;margin-top:13px;
    border:0;border-radius:14px;cursor:pointer;
    font:inherit;font-weight:800;font-size:13.5px;letter-spacing:.09em;
    color:#001318;
    background:linear-gradient(145deg,#1ee7ff,#00b8d4);
    box-shadow:
      6px 6px 16px rgba(0,0,0,.7),
      -4px -4px 12px rgba(255,255,255,.05),
      0 0 0 1px rgba(0,229,255,.35),
      0 0 26px rgba(0,229,255,.35);
    transition:transform .12s,box-shadow var(--dur),filter var(--dur);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  .btn i{font-size:14px}
  .btn::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
    transform:translateX(-130%);
    animation:sheen 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sheen{
    0%,55%{transform:translateX(-130%)}
    75%,100%{transform:translateX(130%)}
  }
  .btn:active:not(:disabled){
    transform:translateY(2px) scale(.985);
    box-shadow:
      inset 5px 5px 12px rgba(0,0,0,.45),
      inset -3px -3px 8px rgba(255,255,255,.12),
      0 0 0 1px rgba(0,229,255,.4),
      0 0 14px rgba(0,229,255,.35);
  }
  .btn:disabled{opacity:.62;cursor:not-allowed;filter:saturate(.5)}
  .btn:disabled::after{animation:none}
  .btn.magenta{
    color:#1a0016;
    background:linear-gradient(145deg,#ff5ce0,#d100b3);
    box-shadow:6px 6px 16px rgba(0,0,0,.7),-4px -4px 12px rgba(255,255,255,.05),0 0 0 1px rgba(255,43,214,.35),0 0 26px rgba(255,43,214,.35);
  }
  .btn.magenta:active:not(:disabled){
    box-shadow:inset 5px 5px 12px rgba(0,0,0,.45),inset -3px -3px 8px rgba(255,255,255,.12),0 0 0 1px rgba(255,43,214,.4),0 0 14px rgba(255,43,214,.35);
  }
  .btn.ghost{
    color:var(--text);
    background:linear-gradient(145deg,#151a27,#0a0d15);
    box-shadow:6px 6px 16px rgba(0,0,0,.7),-4px -4px 12px rgba(255,255,255,.05),inset 0 0 0 1px rgba(255,255,255,.07);
  }
  .btn.ghost:active:not(:disabled){
    box-shadow:inset 5px 5px 12px rgba(0,0,0,.75),inset -3px -3px 8px rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.09);
  }

  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .row .btn{margin-top:0;padding:15px 10px;font-size:12px;letter-spacing:.06em}

  /* ── spinner ────────────────────────────────────────── */
  .spin{
    width:15px;height:15px;flex:0 0 15px;border-radius:50%;
    border:2px solid rgba(0,0,0,.22);border-top-color:currentColor;
    animation:spin .7s linear infinite;display:none;
  }
  .btn.loading .spin{display:block}
  .btn.loading > i:not(.spin){display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── progress ───────────────────────────────────────── */
  .prog{margin-top:13px;display:none;animation:fadeUp .35s ease both}
  .prog.show{display:block}
  .prog-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--text-dim);letter-spacing:.05em;
    margin-bottom:8px;
  }
  .prog-head .val{color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums}
  .prog.magenta .prog-head .val{color:var(--magenta)}
  .track{
    position:relative;height:9px;border-radius:99px;overflow:hidden;
    background:#05070d;
    box-shadow:
      inset 3px 3px 7px rgba(0,0,0,.9),
      inset -2px -2px 5px rgba(255,255,255,.03),
      inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .fill{
    position:absolute;inset:0 auto 0 0;width:0%;border-radius:inherit;
    background:linear-gradient(90deg,var(--cyan),var(--purple),var(--magenta));
    box-shadow:0 0 14px rgba(0,229,255,.55),0 0 26px rgba(255,43,214,.35);
    transition:width .25s ease;
  }
  .prog.magenta .fill{
    background:linear-gradient(90deg,var(--magenta),var(--purple),var(--cyan));
    box-shadow:0 0 14px rgba(255,43,214,.55),0 0 26px rgba(0,229,255,.35);
  }
  .fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
    animation:shimmer 1.4s linear infinite;
  }
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .track.indet .fill{width:38%!important;animation:indet 1.35s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes indet{0%{left:-40%}100%{left:100%}}

  /* ── preview ────────────────────────────────────────── */
  .preview{display:none}
  .preview.show{display:block;animation:fadeUp .45s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .thumb{
    position:relative;
    width:100%;max-width:220px;
    margin:0 auto;
    aspect-ratio:3/4;                 /* portrait — matches TikTok cropcenter 300:400 */
    border-radius:14px;
    overflow:hidden;
    background:#05070d;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.06),
      0 0 36px rgba(0,229,255,.14);
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .thumb::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 42%,rgba(0,0,0,.55));
  }
  .badge{
    position:absolute;top:10px;left:10px;z-index:2;
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:99px;
    font-size:10px;font-weight:800;letter-spacing:.12em;
    color:#001318;background:linear-gradient(140deg,#1ee7ff,#00b8d4);
    box-shadow:0 0 18px rgba(0,229,255,.55);
  }
  .badge i{font-size:10px}

  .play-overlay{
    position:absolute;inset:0;z-index:3;
    display:grid;place-items:center;
    background:transparent;border:0;cursor:pointer;
    color:#fff;
  }
  .play-overlay i{
    width:56px;height:56px;
    display:grid;place-items:center;
    font-size:20px;padding-left:4px;               /* optical centering of the triangle */
    border-radius:50%;
    background:linear-gradient(145deg,#1ee7ff,#00b8d4);
    color:#001318;
    box-shadow:
      0 0 0 6px rgba(0,229,255,.14),
      0 0 34px rgba(0,229,255,.6),
      6px 6px 18px rgba(0,0,0,.6);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .play-overlay:active i{
    transform:scale(.92);
    box-shadow:0 0 0 6px rgba(0,229,255,.2),0 0 24px rgba(0,229,255,.5),inset 4px 4px 10px rgba(0,0,0,.35);
  }

  .meta{margin:14px 0 0;text-align:center}
  .meta h2{
    margin:0;font-size:15px;line-height:1.35;font-weight:700;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta .up{
    margin:8px 0 0;color:var(--text-dim);font-size:12.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .meta .up b{color:var(--magenta);font-weight:700}
  .meta .up i{font-size:10px;opacity:.7}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--text-dim);opacity:.6}

  /* ── modal + video.js ───────────────────────────────── */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:none;
    align-items:center;justify-content:center;
    padding:16px;
  }
  .modal.show{display:flex;animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-backdrop{
    position:absolute;inset:0;
    background:rgba(3,4,8,.86);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
  }
  .modal-shell{
    position:relative;z-index:1;
    width:100%;max-width:400px;
    display:flex;flex-direction:column;gap:12px;
  }
  .modal-inner{
    position:relative;
    width:100%;
    aspect-ratio:9/16;
    max-height:calc(100dvh - 120px - var(--safe-t) - var(--safe-b));
    border-radius:16px;
    overflow:hidden;
    background:#000;
    box-shadow:
      0 0 60px rgba(0,229,255,.35),
      0 20px 60px rgba(0,0,0,.85),
      inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .modal-inner .video-js{
    width:100%;height:100%;
    background:#000;
  }
  .modal-close{
    position:absolute;top:-46px;right:0;
    width:38px;height:38px;
    display:grid;place-items:center;
    border:0;border-radius:12px;cursor:pointer;
    color:var(--text);font-size:15px;
    background:linear-gradient(145deg,#151a27,#0a0d15);
    box-shadow:4px 4px 12px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.07);
    transition:transform .12s,box-shadow var(--dur);
  }
  .modal-close:active{
    transform:translateY(2px);
    box-shadow:inset 4px 4px 10px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.09);
  }

  /* video.js tweaks — match the neon theme */
  .video-js .vjs-big-play-button{
    border:0;
    background:linear-gradient(145deg,#1ee7ff,#00b8d4);
    color:#001318;
    border-radius:50%;
    width:64px;height:64px;
    line-height:64px;
    margin-top:-32px;margin-left:-32px;
    box-shadow:0 0 0 6px rgba(0,229,255,.15),0 0 40px rgba(0,229,255,.6);
  }
  .video-js:hover .vjs-big-play-button,.video-js .vjs-big-play-button:focus{
    background:linear-gradient(145deg,#4fedff,#00cbe8);
    box-shadow:0 0 0 8px rgba(0,229,255,.22),0 0 52px rgba(0,229,255,.75);
  }
  .video-js .vjs-control-bar{
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));
    height:44px;
  }
  .video-js .vjs-play-progress,
  .video-js .vjs-volume-level{background:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.7)}
  .video-js .vjs-load-progress div{background:rgba(255,255,255,.15)}
  .video-js .vjs-slider{background:rgba(255,255,255,.15)}

  /* ── toast ──────────────────────────────────────────── */
  .toast{
    position:fixed;left:50%;bottom:calc(20px + var(--safe-b));
    transform:translate(-50%,140%);
    z-index:200;max-width:calc(100% - 32px);
    padding:13px 18px;border-radius:14px;
    background:linear-gradient(145deg,#151a27,#0a0d15);
    color:var(--text);font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:9px;
    box-shadow:
      8px 8px 22px rgba(0,0,0,.75),
      inset 0 0 0 1px rgba(255,255,255,.07),
      0 0 32px rgba(0,229,255,.28);
    transition:transform .38s cubic-bezier(.2,.9,.25,1.2),opacity .3s;
    opacity:0;pointer-events:none;
  }
  .toast i{font-size:14px;color:var(--cyan)}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .toast.err{box-shadow:8px 8px 22px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,43,214,.35),0 0 32px rgba(255,43,214,.4)}
  .toast.err i{color:var(--magenta)}
  .toast.ok{box-shadow:8px 8px 22px rgba(0,0,0,.75),inset 0 0 0 1px rgba(34,255,136,.3),0 0 32px rgba(34,255,136,.35)}
  .toast.ok i{color:var(--green)}

  @media (min-width:640px){
    h1{font-size:19px}
    .btn{font-size:14.5px}
    .row .btn{font-size:13px}
    .thumb{max-width:260px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<header>
  <div class="brand">
    <div class="logo"><i class="fa-solid fa-bolt"></i></div>
    <div>
      <h1>NEON TIKTOK DL</h1>
      <p>PASTE · EXTRACT · DOWNLOAD</p>
    </div>
  </div>
</header>

<main>
  <div class="scroll">

    <!-- INPUT -->
    <section class="card">
      <label class="field" for="url">
        <i class="fa-solid fa-link"></i>
        <input id="url" type="url" inputmode="url" autocomplete="off"
               autocapitalize="off" spellcheck="false"
               placeholder="https://vt.tiktok.com/…" />
      </label>

      <button class="btn" id="extractBtn" type="button">
        <span class="spin" aria-hidden="true"></span>
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span class="lbl">EXTRACT VIDEO</span>
      </button>

      <div class="prog" id="extractProg">
        <div class="prog-head"><span>Extracting…</span><span class="val" id="extractPct">…</span></div>
        <div class="track indet" id="extractTrack"><div class="fill"></div></div>
      </div>
    </section>

    <!-- PREVIEW -->
    <section class="card preview" id="preview">
      <div class="thumb">
        <span class="badge"><i class="fa-brands fa-tiktok"></i> TIKTOK</span>
        <img id="thumb" alt="" loading="lazy" referrerpolicy="no-referrer" />
        <button class="play-overlay" id="playBtn" type="button" aria-label="Play video">
          <i class="fa-solid fa-play"></i>
        </button>
      </div>

      <div class="meta">
        <h2 id="title">—</h2>
        <p class="up">
          <i class="fa-solid fa-user"></i>
          <b id="uploader">—</b>
          <span class="dot"></span>
          <span id="platform">tiktok</span>
        </p>
      </div>

      <div class="row">
        <button class="btn" id="dlVideo" type="button">
          <span class="spin" aria-hidden="true"></span>
          <i class="fa-solid fa-download"></i>
          <span class="lbl">VIDEO</span>
        </button>
        <button class="btn magenta" id="dlThumb" type="button">
          <span class="spin" aria-hidden="true"></span>
          <i class="fa-solid fa-image"></i>
          <span class="lbl">THUMB</span>
        </button>
      </div>

      <div class="prog" id="dlProg">
        <div class="prog-head"><span id="dlLabel">Downloading…</span><span class="val" id="dlPct">0%</span></div>
        <div class="track" id="dlTrack"><div class="fill"></div></div>
      </div>
    </section>

  </div>
</main>

<footer>
  <span>FOR PERSONAL USE</span>
  <i class="fa-solid fa-heart"></i>
  <span>RESPECT CREATORS</span>
</footer>

<!-- VIDEO MODAL -->
<div class="modal" id="videoModal" aria-hidden="true" role="dialog">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-shell">
    <div class="modal-inner">
      <video id="player" class="video-js vjs-default-skin vjs-big-play-centered" playsinline></video>
    </div>
    <button class="modal-close" data-close aria-label="Close">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <i class="fa-solid fa-circle-info" id="toastIcon"></i>
  <span id="toastMsg"></span>
</div>

<script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
<script>
(() => {
  "use strict";

  // ─── config ──────────────────────────────────────────────
  const API_BASE = "https://tiktokio-api-tan.vercel.app";
  const EXTRACT  = `${API_BASE}/api/tiktok`;
  const STREAM   = `${API_BASE}/api/stream`;
  const RE_URL   = /https?:\/\/[^\s]+/i;

  // ─── dom ─────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const urlInput   = $("url");
  const extractBtn = $("extractBtn");
  const extractPrg = $("extractProg");
  const extractPct = $("extractPct");
  const extractTrk = $("extractTrack");
  const preview    = $("preview");
  const thumbImg   = $("thumb");
  const playBtn    = $("playBtn");
  const titleEl    = $("title");
  const uploaderEl = $("uploader");
  const platformEl = $("platform");
  const dlVideo    = $("dlVideo");
  const dlThumb    = $("dlThumb");
  const dlPrg      = $("dlProg");
  const dlPct      = $("dlPct");
  const dlLabel    = $("dlLabel");
  const dlTrack    = $("dlTrack");
  const modal      = $("videoModal");
  const toastEl    = $("toast");
  const toastIcon  = $("toastIcon");
  const toastMsg   = $("toastMsg");

  let current = null;
  let player  = null;

  // ─── helpers ─────────────────────────────────────────────
  function toast(msg, kind = "") {
    toastMsg.textContent = msg;
    toastIcon.className =
      kind === "err" ? "fa-solid fa-circle-exclamation" :
      kind === "ok"  ? "fa-solid fa-circle-check" :
                       "fa-solid fa-circle-info";
    toastEl.className = "toast show " + kind;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 3200);
  }

  function setLoading(btn, on) {
    btn.classList.toggle("loading", on);
    btn.disabled = on;
  }

  function setExtractProgress(pct) {
    if (pct === null) {
      extractTrk.classList.add("indet");
      extractPct.textContent = "…";
    } else {
      extractTrk.classList.remove("indet");
      extractTrk.firstElementChild.style.width = pct + "%";
      extractPct.textContent = Math.round(pct) + "%";
    }
  }

  function setDlProgress(pct, label) {
    if (label) dlLabel.textContent = label;
    if (pct === null) {
      dlTrack.classList.add("indet");
      dlPct.textContent = "…";
    } else {
      dlTrack.classList.remove("indet");
      dlTrack.firstElementChild.style.width = pct + "%";
      dlPct.textContent = Math.round(pct) + "%";
    }
  }

  function fmtBytes(b) {
    if (!b && b !== 0) return "";
    const u = ["B", "KB", "MB", "GB"];
    let i = 0, n = b;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return n.toFixed(n < 10 && i > 0 ? 1 : 0) + " " + u[i];
  }

  function slug(s, max = 30) {
    return (s || "")
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\p{L}\p{N}\s_-]/gu, "")
      .replace(/\s+/g, "_")
      .replace(/_+/g, "_")
      .replace(/^[_\-.]+|[_\-.]+$/g, "")
      .slice(0, max) || "video";
  }

  function stamp(d = new Date()) {
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  // Prefer the numeric TikTok ID. Falls back to uploader_timestamp if missing.
  function buildFilename(data, ext, kind = "video") {
    const suffix = kind === "thumbnail" ? "_thumb" : "";
    if (data.video_id) {
      return `${data.video_id}${suffix}.${ext}`;
    }
    const user = slug(data.uploader, 20);
    const ts   = stamp();
    return `${user}_${ts}${suffix}.${ext}`;
  }

  function extractUrl(text) {
    const m = (text || "").match(RE_URL);
    return m ? m[0] : "";
  }

  // ─── extraction ──────────────────────────────────────────
  async function extract(rawInput) {
    const url = extractUrl(rawInput) || (rawInput || "").trim();
    if (!url) { toast("Paste a TikTok link first", "err"); return; }

    setLoading(extractBtn, true);
    extractPrg.classList.add("show");
    preview.classList.remove("show");
    setExtractProgress(null);

    try {
      const res = await fetch(EXTRACT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, type: "" }),
      });
      const data = await res.json();

      if (!res.ok || data.status !== "success") {
        throw new Error(data.error || data.message || `HTTP ${res.status}`);
      }

      setExtractProgress(100);
      current = data;

      thumbImg.src = data.thumbnail || "";
      thumbImg.alt = data.title || "TikTok thumbnail";
      titleEl.textContent = data.title || "(no title)";
      uploaderEl.textContent = data.uploader || "unknown";
      platformEl.textContent = data.platform || "tiktok";

      preview.classList.add("show");
      toast("Ready to download", "ok");
      if (navigator.vibrate) navigator.vibrate(12);

      setTimeout(() => extractPrg.classList.remove("show"), 800);
    } catch (err) {
      console.error(err);
      toast("Extract failed: " + err.message, "err");
      extractPrg.classList.remove("show");
    } finally {
      setLoading(extractBtn, false);
    }
  }

  // ─── videojs modal ───────────────────────────────────────
  function openPlayer() {
    if (!current?.stream_url) return;

    // Route the media through our own proxy so it's CORS-friendly and seekable
    const src    = `${STREAM}?url=${encodeURIComponent(current.stream_url)}`;
    const poster = current.thumbnail || "";

    modal.classList.add("show");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.touchAction = "none";

    if (player) { player.dispose(); player = null; }

    player = videojs("player", {
      controls: true,
      autoplay: true,
      preload: "auto",
      fill: true,
      poster,
      playsinline: true,
      sources: [{ src, type: "video/mp4" }],
      controlBar: {
        pictureInPictureToggle: false,
        remainingTimeDisplay: true,
      },
    });

    player.ready(() => {
      player.play().catch(() => { /* autoplay blocked — user taps play */ });
    });

    player.on("error", () => {
      toast("Playback failed — try downloading instead", "err");
    });
  }

  function closePlayer() {
    modal.classList.remove("show");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.touchAction = "";
    if (player) {
      try { player.pause(); } catch {}
      player.dispose();
      player = null;
    }
  }

  // ─── download with real progress ─────────────────────────
  async function downloadWithProgress(url, filename, useProxy, kind = "video") {
    const target = useProxy
      ? `${STREAM}?url=${encodeURIComponent(url)}`
      : url;

    dlPrg.classList.add("show");
    dlPrg.classList.toggle("magenta", kind === "thumbnail");
    setDlProgress(0, kind === "thumbnail" ? "Downloading thumbnail…" : "Downloading video…");

    let res;
    try {
      res = await fetch(target, { mode: "cors" });
    } catch (e) {
      if (useProxy) { console.warn("Proxy failed, falling back:", e); return downloadDirect(url, filename); }
      throw e;
    }
    if (!res.ok) {
      if (useProxy) return downloadDirect(url, filename);
      throw new Error(`HTTP ${res.status}`);
    }

    const total    = Number(res.headers.get("Content-Length")) || 0;
    const reader   = res.body.getReader();
    const chunks   = [];
    let received   = 0;
    let lastTick   = performance.now();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;

      const now = performance.now();
      if (now - lastTick > 90) {
        lastTick = now;
        if (total) {
          const pct = Math.min(99.5, (received / total) * 100);
          setDlProgress(pct, `Downloading… ${fmtBytes(received)} / ${fmtBytes(total)}`);
        } else {
          setDlProgress(null, `Downloading… ${fmtBytes(received)}`);
        }
      }
    }

    setDlProgress(100, "Finishing…");

    const blob   = new Blob(chunks, { type: res.headers.get("Content-Type") || "application/octet-stream" });
    const objUrl = URL.createObjectURL(blob);
    triggerSave(objUrl, filename);
    setTimeout(() => URL.revokeObjectURL(objUrl), 4000);

    toast("Saved to device", "ok");
    if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
    setTimeout(() => dlPrg.classList.remove("show"), 900);
  }

  function downloadDirect(url, filename) {
    setDlProgress(null, "Handing off to browser…");
    toast("Browser is downloading (no live progress)", "");
    triggerSave(url, filename);
    setTimeout(() => dlPrg.classList.remove("show"), 2200);
  }

  function triggerSave(href, filename) {
    const a = document.createElement("a");
    a.href = href;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // ─── events ──────────────────────────────────────────────
  extractBtn.addEventListener("click", () => extract(urlInput.value));

  urlInput.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); extract(urlInput.value); urlInput.blur(); }
  });

  urlInput.addEventListener("paste", e => {
    const txt = (e.clipboardData || window.clipboardData).getData("text");
    const clean = extractUrl(txt);
    if (clean && clean !== txt) {
      e.preventDefault();
      urlInput.value = clean;
      toast("Link cleaned");
    }
  });

  playBtn.addEventListener("click", openPlayer);

  // Close modal — backdrop or X button, and ESC key
  modal.addEventListener("click", e => { if (e.target.closest("[data-close]")) closePlayer(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && modal.classList.contains("show")) closePlayer();
  });

  dlVideo.addEventListener("click", async () => {
    if (!current?.stream_url) return;
    setLoading(dlVideo, true);
    try {
      await downloadWithProgress(
        current.stream_url,
        buildFilename(current, "mp4", "video"),
        true,
        "video"
      );
    } catch (e) {
      console.error(e);
      toast("Download failed: " + e.message, "err");
      dlPrg.classList.remove("show");
    } finally {
      setLoading(dlVideo, false);
    }
  });

  dlThumb.addEventListener("click", async () => {
    if (!current?.thumbnail) return;
    setLoading(dlThumb, true);
    try {
      await downloadWithProgress(
        current.thumbnail,
        buildFilename(current, "jpg", "thumbnail"),
        false,
        "thumbnail"
      );
    } catch (e) {
      console.error(e);
      toast("Thumbnail failed: " + e.message, "err");
      dlPrg.classList.remove("show");
    } finally {
      setLoading(dlThumb, false);
    }
  });

  // Autofill from ?url=…
  const param = new URLSearchParams(location.search).get("url");
  if (param) { urlInput.value = param; extract(param); }
})();
</script>
</body>
</html>
