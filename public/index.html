<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#06070d" />
<title>TikTok Downloader</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="https://vjs.zencdn.net/8.16.1/video-js.css" />
<style>
/* ═══════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════ */
:root{
  /* ── palette ──────────────────────────────────────── */
  --bg:#06070d;
  --cyan:#00e5ff;
  --magenta:#ff2bd6;
  --purple:#a855f7;
  --green:#22ff88;

  /* ── text ─────────────────────────────────────────── */
  --text:#e8ecf5;
  --text-dim:#7a8099;
  --text-mute:#4d5470;
  --text-on-cyan:#001318;
  --text-on-magenta:#1a0016;

  /* ── surfaces ─────────────────────────────────────── */
  --sink-1:#080a11;              /* field, extract-status bg      */
  --sink-2:#05070d;              /* thumb, track bg                */
  --sink-3:#0a0e18;              /* focused field                  */
  --skel-top:#0d1220;            /* preview skeleton thumb top     */
  --skel-bot:#080b13;            /* preview skeleton thumb bottom  */

  /* ── gradients ────────────────────────────────────── */
  --surface:linear-gradient(145deg,#131826,#0a0d15);
  --rail:linear-gradient(140deg,
    rgba(0,229,255,.35) 0%,
    transparent 40%,
    transparent 60%,
    rgba(255,43,214,.35) 100%);
  --btn-cyan:linear-gradient(145deg,#1ee7ff,#00b8d4);
  --btn-cyan-hover:linear-gradient(145deg,#4fedff,#00cbe8);
  --btn-magenta:linear-gradient(145deg,#ff5ce0,#d100b3);
  --track:linear-gradient(90deg,var(--cyan),var(--purple),var(--magenta));
  --track-rev:linear-gradient(90deg,var(--magenta),var(--purple),var(--cyan));
  --thumb-fade:linear-gradient(180deg,transparent 42%,rgba(0,0,0,.55));
  --thumb-fade-skel:linear-gradient(180deg,transparent 42%,rgba(0,0,0,.45));
  --sheen:linear-gradient(115deg,
    transparent 30%,
    rgba(255,255,255,.55) 50%,
    transparent 70%);
  --sheen-narrow:linear-gradient(115deg,
    transparent 35%,
    rgba(255,255,255,.55) 50%,
    transparent 65%);
  --shimmer:linear-gradient(90deg,
    rgba(255,255,255,0)    0%,
    rgba(255,255,255,.12) 40%,
    rgba(255,255,255,.30) 50%,
    rgba(255,255,255,.12) 60%,
    rgba(255,255,255,0)  100%);
  --skel-line:linear-gradient(90deg,
    rgba(255,255,255,.02)  0%,
    rgba(255,255,255,.06) 40%,
    rgba(255,255,255,.10) 50%,
    rgba(255,255,255,.06) 60%,
    rgba(255,255,255,.02)100%);
  --title-grad:linear-gradient(92deg,var(--cyan) 0%,#fff 45%,var(--magenta) 100%);

  /* ── neumorph building blocks ─────────────────────── */
  --drop-sm:4px 4px 11px rgba(0,0,0,.7);
  --drop-md:5px 5px 12px rgba(0,0,0,.75);
  --drop-lg:6px 6px 16px rgba(0,0,0,.72);
  --lift-sm:-3px -3px 9px rgba(255,255,255,.03);
  --lift-md:-4px -4px 13px rgba(255,255,255,.028);
  --edge-hair:inset 0 0 0 1px rgba(255,255,255,.045);
  --edge-soft:inset 0 0 0 1px rgba(255,255,255,.04);
  --edge-line:inset 0 0 0 1px rgba(255,255,255,.05);
  --inset-deep:inset 3px 3px 7px rgba(0,0,0,.85);
  --inset-shallow:inset -2px -2px 4px rgba(255,255,255,.025);

  /* ── composed surfaces ────────────────────────────── */
  --rise:var(--drop-lg),var(--lift-md),var(--edge-hair);
  --rise-sm:var(--drop-md),var(--lift-sm),var(--edge-line);
  --rise-md:var(--drop-md),var(--lift-sm),var(--edge-line);
  --sink:var(--inset-deep),var(--inset-shallow),var(--edge-soft);

  /* ── glows ────────────────────────────────────────── */
  --glow-cyan-sm:0 0 14px rgba(0,229,255,.55);
  --glow-cyan-md:0 0 20px rgba(0,229,255,.3);
  --glow-cyan-lg:0 0 26px rgba(0,229,255,.55);
  --glow-cyan-ring:0 0 0 5px rgba(0,229,255,.14);
  --glow-magenta-sm:0 0 14px rgba(255,43,214,.35);
  --glow-magenta-md:0 0 20px rgba(255,43,214,.35);
  --glow-magenta-lg:0 0 26px rgba(255,43,214,.4);
  --glow-green:0 0 26px rgba(34,255,136,.35);

  /* ── misc ─────────────────────────────────────────── */
  --backdrop:rgba(3,4,8,.86);
  --focus-ring:inset 0 0 0 1px rgba(0,229,255,.45),
               0 0 0 3px rgba(0,229,255,.08),
               0 0 18px rgba(0,229,255,.22);

  /* ── motion ───────────────────────────────────────── */
  --dur:.28s;
  --enter:fadeUp .3s ease both;

  /* ── geometry ─────────────────────────────────────── */
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

/* ═══════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
html{overscroll-behavior:none}
body{
  background:var(--bg);
  color:var(--text);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;
  gap:14px;height:100dvh;overflow:hidden;
  overscroll-behavior:none;
}

/* ═══════════════════════════════════════════════════════
   AMBIENT BACKGROUND
   ═══════════════════════════════════════════════════════ */
.bg-grid,.bg-glow{position:fixed;pointer-events:none;z-index:0}
.bg-grid{
  inset:-2px;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 78%);
}
.bg-glow{
  width:60vmax;height:60vmax;border-radius:50%;
  filter:blur(90px);opacity:.28;
  animation:float 18s ease-in-out infinite;
}
.bg-glow-1{top:-24vmax;left:-22vmax;
  background:radial-gradient(circle,var(--cyan),transparent 62%)}
.bg-glow-2{bottom:-26vmax;right:-24vmax;
  background:radial-gradient(circle,var(--magenta),transparent 62%);
  animation-delay:-9s}

/* ═══════════════════════════════════════════════════════
   LAYOUT SHELL
   ═══════════════════════════════════════════════════════ */
header{
  flex:0 0 auto;position:relative;z-index:2;
  width:100%;max-width:560px;margin:0 auto;
  padding:calc(8px + var(--safe-t)) 12px 8px;
}
.brand{
  position:relative;
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-radius:var(--r);
  background:var(--surface);
  box-shadow:var(--rise);
}
.brand::before,
.card::before,
footer .foot-inner::before{
  content:"";position:absolute;inset:-1px;
  border-radius:inherit;padding:1px;
  background:var(--rail);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;opacity:.7;
}
.logo{
  width:36px;height:36px;flex:0 0 36px;
  display:grid;place-items:center;
  font-size:15px;border-radius:11px;
  color:var(--cyan);
  background:var(--surface);
  box-shadow:
    var(--drop-md),
    var(--lift-sm),
    var(--edge-line),
    var(--glow-cyan-md);
  animation:pulseLogo 3.4s ease-in-out infinite;
}
h1{
  margin:0;font-size:15px;font-weight:800;letter-spacing:.02em;
  background:var(--title-grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(0,229,255,.35));
}
header p{margin:1px 0 0;color:var(--text-dim);
  font-size:10px;letter-spacing:.06em}

main{
  flex:1 1 0;min-height:0;overflow:hidden;
  position:relative;z-index:1;
  display:flex;flex-direction:column;
}
.scroll{
  flex:1 1 auto;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scrollbar-width:none;
  width:100%;max-width:560px;margin:0 auto;
  padding:0 12px 12px;
  display:flex;flex-direction:column;gap:9px;
}
.scroll::-webkit-scrollbar{display:none}

footer{
  flex:0 0 auto;position:relative;z-index:2;
  width:100%;max-width:560px;margin:0 auto;
  padding:0 12px calc(8px + var(--safe-b));
}
footer .foot-inner{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 12px;border-radius:var(--r);
  background:var(--surface);
  box-shadow:var(--rise);
  color:var(--text-mute);font-size:9.5px;letter-spacing:.08em;
}
footer .foot-inner i{font-size:8px;color:var(--magenta)}

/* ═══════════════════════════════════════════════════════
   SHARED COMPONENTS
   ═══════════════════════════════════════════════════════ */
.card{
  position:relative;
  background:var(--surface);
  border-radius:var(--r);
  padding:9px;
  box-shadow:var(--rise);
}

.field{
  position:relative;display:flex;align-items:center;gap:8px;
  background:var(--sink-1);border-radius:10px;
  padding:0 10px;
  box-shadow:var(--sink);
  transition:box-shadow var(--dur),background var(--dur);
}
.field:focus-within{
  background:var(--sink-3);
  box-shadow:var(--inset-deep),var(--inset-shallow),var(--focus-ring);
}
.field > i{flex:0 0 auto;font-size:13px;
  color:var(--text-dim);transition:color var(--dur)}
.field:focus-within > i{color:var(--cyan)}
.field input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:var(--text);font:inherit;padding:9px 0;font-size:15px;
}
.field input::placeholder{color:var(--text-mute)}

/* ── buttons ──────────────────────────────────────── */
.btn{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:9px 12px;margin-top:6px;
  border:0;border-radius:10px;cursor:pointer;
  font:inherit;font-weight:800;font-size:11.5px;letter-spacing:.08em;
  color:var(--text-on-cyan);
  background:var(--btn-cyan);
  box-shadow:
    var(--drop-sm),
    var(--lift-sm),
    0 0 0 1px rgba(0,229,255,.35),
    var(--glow-cyan-sm);
  transition:transform .12s,box-shadow var(--dur),filter var(--dur);
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
.btn i{font-size:13px}
.btn::after{
  content:"";position:absolute;inset:0;
  background:var(--sheen);
  transform:translateX(-130%);
  animation:sheen 3.2s ease-in-out infinite;
  pointer-events:none;
}
.btn:active:not(:disabled){
  transform:translateY(2px) scale(.985);
  box-shadow:
    inset 4px 4px 10px rgba(0,0,0,.45),
    inset -3px -3px 7px rgba(255,255,255,.12),
    0 0 0 1px rgba(0,229,255,.4),
    0 0 12px rgba(0,229,255,.35);
}
.btn:disabled{opacity:.62;cursor:not-allowed;filter:saturate(.5)}
.btn:disabled::after{animation:none}

.btn.magenta{
  color:var(--text-on-magenta);
  background:var(--btn-magenta);
  box-shadow:
    var(--drop-md),
    var(--lift-sm),
    0 0 0 1px rgba(255,43,214,.35),
    var(--glow-magenta-md);
}
.btn.magenta:active:not(:disabled){
  box-shadow:
    inset 4px 4px 10px rgba(0,0,0,.45),
    inset -3px -3px 7px rgba(255,255,255,.12),
    0 0 0 1px rgba(255,43,214,.4),
    0 0 12px rgba(255,43,214,.35);
}

.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
.row .btn{margin-top:0;padding:9px 8px;font-size:11px;letter-spacing:.05em}

/* ── spinners ─────────────────────────────────────── */
.spin{
  width:13px;height:13px;flex:0 0 13px;border-radius:50%;
  border:2px solid rgba(0,0,0,.22);
  border-top-color:currentColor;
  animation:spin .7s linear infinite;display:none;
}
.btn.loading .spin{display:block}
.btn.loading > i:not(.spin){display:none}

.spin-big{
  width:14px;height:14px;flex:0 0 14px;border-radius:50%;
  border:2px solid rgba(0,229,255,.15);
  border-top-color:var(--cyan);
  animation:spinBig .7s linear infinite;
  box-shadow:0 0 12px rgba(0,229,255,.4);
  will-change:transform;
}

/* ── progress ─────────────────────────────────────── */
.prog{margin-top:9px;display:none;animation:var(--enter)}
.prog.show{display:block}
.prog-head{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--text-dim);letter-spacing:.05em;
  margin-bottom:5px;
}
.prog-head .val{color:var(--cyan);font-weight:700;
  font-variant-numeric:tabular-nums}
.prog.magenta .prog-head .val{color:var(--magenta)}
.track{
  position:relative;height:7px;border-radius:99px;overflow:hidden;
  background:var(--sink-2);
  box-shadow:
    inset 3px 3px 6px rgba(0,0,0,.9),
    inset -2px -2px 4px rgba(255,255,255,.03),
    var(--edge-soft);
}
.fill{
  position:absolute;inset:0 auto 0 0;width:0%;border-radius:inherit;
  background:var(--track);
  box-shadow:
    0 0 12px rgba(0,229,255,.55),
    0 0 22px rgba(255,43,214,.35);
  transition:width .25s ease;
}
.prog.magenta .fill{
  background:var(--track-rev);
  box-shadow:
    0 0 12px rgba(255,43,214,.55),
    0 0 22px rgba(0,229,255,.35);
}
.fill::after{
  content:"";position:absolute;inset:0;
  background:var(--sheen-narrow);
  animation:shimmerSweep 1.4s linear infinite;
}
.track.indet .fill{
  width:38%!important;
  animation:indet 1.35s cubic-bezier(.5,0,.5,1) infinite;
}

/* ── toast ────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:calc(14px + var(--safe-b));
  transform:translate(-50%,140%);
  z-index:200;max-width:calc(100% - 24px);
  padding:10px 14px;border-radius:11px;
  background:var(--surface);
  color:var(--text);font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:7px;
  box-shadow:
    var(--drop-lg),
    inset 0 0 0 1px rgba(255,255,255,.07),
    0 0 26px rgba(0,229,255,.28);
  transition:transform .38s cubic-bezier(.2,.9,.25,1.2),opacity .3s;
  opacity:0;pointer-events:none;
}
.toast i{font-size:13px;color:var(--cyan)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{
  box-shadow:
    var(--drop-lg),
    inset 0 0 0 1px rgba(255,43,214,.35),
    var(--glow-magenta-lg);
}
.toast.err i{color:var(--magenta)}
.toast.ok{
  box-shadow:
    var(--drop-lg),
    inset 0 0 0 1px rgba(34,255,136,.3),
    var(--glow-green);
}
.toast.ok i{color:var(--green)}

/* ═══════════════════════════════════════════════════════
   EXTRACT-STATUS (3 states)
   ═══════════════════════════════════════════════════════ */
.extract-status{
  display:none;
  align-items:center;gap:9px;
  min-height:36px;
  margin-top:9px;padding:9px 12px;border-radius:11px;
  background:var(--sink-1);
  box-shadow:var(--sink);
  font-size:12px;color:var(--text-dim);letter-spacing:.05em;
}
.extract-status .spin-big,
.extract-status .sk-bar,
.extract-status .done-icon,
.extract-status .done-text{display:none}

/* state 2 — extracting */
.extract-status.show{
  display:flex;
  animation:var(--enter);
}
.extract-status.show .spin-big{display:inline-block}

/* state 1 — skeleton */
.extract-status.skeleton{
  display:grid;
  grid-template-columns:auto 1fr;
  grid-template-rows:auto auto;
  column-gap:10px;row-gap:6px;
  align-items:center;
  animation:var(--enter);
}
.extract-status.skeleton #extractStage{display:none}
.extract-status.skeleton .spin-big,
.extract-status.skeleton .sk-bar{display:block}
.extract-status.skeleton .spin-big{
  grid-row:1 / 3;
  border:0;
  background-color:rgba(255,255,255,.08);
  background-image:var(--shimmer);
  background-size:200% 100%;
  animation:shimmerSlide 1.6s linear infinite;
  box-shadow:none;
}
.extract-status.skeleton .sk-bar{
  border-radius:6px;
  background-color:rgba(255,255,255,.08);
  background-image:var(--shimmer);
  background-size:200% 100%;
  animation:shimmerSlide 1.6s linear infinite;
}
.extract-status.skeleton .sk-bar-1{width:70%;height:12px}
.extract-status.skeleton .sk-bar-2{width:42%;height:10px}

/* state 3 — completed */
.extract-status.done{
  display:flex;
  animation:var(--enter);
  color:var(--green);
}
.extract-status.done .done-icon{
  display:inline-flex;
  color:var(--green);
  font-size:14px;
  filter:drop-shadow(0 0 8px rgba(34,255,136,.5));
}
.extract-status.done .done-text{
  display:inline;
  font-weight:700;letter-spacing:.06em;
}

/* ═══════════════════════════════════════════════════════
   PREVIEW
   ═══════════════════════════════════════════════════════ */
.preview{display:none}
.preview.show,
.preview.skeleton{
  display:block;
  animation:fadeUp .45s ease both;
}

.thumb{
  position:relative;
  width:100%;max-width:160px;margin:0 auto;
  aspect-ratio:3/4;
  padding:5px;
  border-radius:11px;overflow:hidden;
  background:var(--sink-2);
  box-shadow:
    inset 4px 4px 10px rgba(0,0,0,.9),
    inset -2px -2px 6px rgba(255,255,255,.03),
    var(--edge-line),
    0 0 28px rgba(0,229,255,.14);
}
.thumb img{
  width:100%;height:100%;
  object-fit:cover;display:block;
  border-radius:7px;
  box-shadow:0 0 0 1px rgba(0,0,0,.55);
}
.thumb::after{
  content:"";position:absolute;inset:0;
  pointer-events:none;border-radius:inherit;
  background:var(--thumb-fade);
  z-index:2;
}
.badge{
  position:absolute;top:8px;left:8px;z-index:3;
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 8px;border-radius:99px;
  font-size:9px;font-weight:800;letter-spacing:.12em;
  color:var(--text-on-cyan);
  background:var(--btn-cyan);
  box-shadow:var(--glow-cyan-sm);
}
.badge i{font-size:9px}
.play-overlay{
  position:absolute;inset:0;z-index:4;
  display:grid;place-items:center;
  background:transparent;border:0;cursor:pointer;color:#fff;
}
.play-overlay i{
  width:44px;height:44px;
  display:grid;place-items:center;
  font-size:16px;padding-left:3px;
  border-radius:50%;
  background:var(--btn-cyan);
  color:var(--text-on-cyan);
  box-shadow:
    var(--glow-cyan-ring),
    0 0 26px rgba(0,229,255,.6),
    5px 5px 14px rgba(0,0,0,.6);
  transition:transform .18s ease,box-shadow .18s ease;
}
.play-overlay:active i{
  transform:scale(.92);
  box-shadow:
    0 0 0 5px rgba(0,229,255,.2),
    0 0 20px rgba(0,229,255,.5),
    inset 4px 4px 10px rgba(0,0,0,.35);
}
.meta{position:relative;margin:9px 0 0;text-align:center}

.meta h2{
  margin:0;font-size:13px;line-height:1.3;font-weight:700;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.meta .up{
  margin:4px 0 0;color:var(--text-dim);font-size:11px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.meta .up b{color:var(--magenta);font-weight:700}
.meta .up i{font-size:9px;opacity:.7}
.dot{width:3px;height:3px;border-radius:50%;
  background:var(--text-dim);opacity:.6}

/* ═══════════════════════════════════════════════════════
   SKELETON (preview)
   ═══════════════════════════════════════════════════════ */
.preview.skeleton .thumb img,
.preview.skeleton .play-overlay,
.preview.skeleton .meta h2,
.preview.skeleton .meta .up,
.preview.skeleton .row .btn{visibility:hidden}

.preview.skeleton .thumb{
  background:linear-gradient(145deg,var(--skel-top),var(--skel-bot));
  box-shadow:var(--edge-soft);
}
.preview.skeleton .thumb::before{
  content:"";position:absolute;inset:0;
  background-image:var(--skel-line);
  background-size:200% 100%;
  animation:shimmerSlide 1.6s linear infinite;
}
.preview.skeleton .thumb::after{background:var(--thumb-fade-skel)}

/* skeleton text placeholders — overlay the real h2/.up, no extra height */
.sk-line{
  display:none;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  height:11px;border-radius:6px;
  background-image:var(--skel-line);

/* ═══════════════════════════════════════════════════════
   ANIMATIONS
   ═══════════════════════════════════════════════════════ */
@keyframes float{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%    {transform:translate3d(3vmax,-3vmax,0) scale(1.14)}
}
@keyframes pulseLogo{
  0%,100%{
    box-shadow:
      var(--drop-md),
      var(--lift-sm),
      var(--edge-line),
      var(--glow-cyan-md);
  }
  50%{
    box-shadow:
      var(--drop-md),
      var(--lift-sm),
      inset 0 0 0 1px rgba(255,255,255,.08),
      var(--glow-cyan-lg);
  }
}
@keyframes sheen{
  0%,55%{transform:translateX(-130%)}
  75%,100%{transform:translateX(130%)}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinBig{
  0%  {transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
@keyframes shimmerSweep{
  0%  {transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
@keyframes shimmerSlide{
  0%  {background-position:-200% 0}
  100%{background-position: 200% 0}
}
@keyframes indet{
  0%  {left:-40%}
  100%{left:100%}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to  {opacity:1;transform:none}
}
@keyframes fadeIn{
  from{opacity:0}
  to  {opacity:1}
}

<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<header>
  <div class="brand">

  <div>

<main>

<!-- VIDEO MODAL -->

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <i class="fa-solid fa-circle-info" id="toastIcon"></i>
  <span id="toastMsg"></span>
</div>

<script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
<script>
(() => {
  "use strict";

  const API_BASE = "https://tiktokio-api-tan.vercel.app";
  const EXTRACT  = `${API_BASE}/api/tiktok`;
  const STREAM   = `${API_BASE}/api/stream`;
  const RE_URL   = /https?:\/\/[^\s]+/i;

  const $ = id => document.getElementById(id);
  const urlInput   = $("url");
  const extractBtn = $("extractBtn");
  const extractPrg = $("extractProg");
  const preview    = $("preview");
  const thumbImg   = $("thumb");
  const playBtn    = $("playBtn");
  const titleEl    = $("title");
  const uploaderEl = $("uploader");
  const platformEl = $("platform");
  const dlVideo    = $("dlVideo");
  const dlThumb    = $("dlThumb");
  const dlPrg      = $("dlProg");
  const dlPct      = $("dlPct");
  const dlLabel    = $("dlLabel");
  const dlTrack    = $("dlTrack");
  const modal      = $("videoModal");
  const toastEl    = $("toast");
  const toastIcon  = $("toastIcon");
  const toastMsg   = $("toastMsg");

  let current = null;
  let player  = null;

  // ─── helpers ─────────────────────────────────────────
  function toast(msg, kind = "") {
    toastMsg.textContent = msg;
    toastIcon.className =
      kind === "err" ? "fa-solid fa-circle-exclamation" :
      kind === "ok"  ? "fa-solid fa-circle-check" :
                       "fa-solid fa-circle-info";
    toastEl.className = "toast show " + kind;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 3200);
  }

  function setLoading(btn, on) {
    btn.classList.toggle("loading", on);
    btn.disabled = on;
  }

  function setExtractStage(text) {
    const el = $("extractStage");
    if (el) el.textContent = text;
  }
  
  function reset() {
  // close player if open
  if (player) closePlayer();
  
  // extract-status → back to skeleton
  extractPrg.classList.remove("show", "done");
  extractPrg.classList.add("skeleton");
  setExtractStage("Loading preview…");
  
  // preview → back to skeleton
  preview.classList.remove("show");
  preview.classList.add("skeleton");
  
  // clear preview content
  thumbImg.removeAttribute("src");
  thumbImg.alt = "";
  titleEl.textContent = "—";
  uploaderEl.textContent = "—";
  platformEl.textContent = "tiktok";
  
  // hide download progress
  dlPrg.classList.remove("show", "magenta");
  dlTrack.classList.remove("indet");
  dlTrack.firstElementChild.style.width = "0%";
  dlPct.textContent = "0%";
  dlLabel.textContent = "Downloading…";
  
  // clear state
  current = null;
  setLoading(extractBtn, false);
  
  // clear input and focus
  urlInput.value = "";
  urlInput.focus();
  
  toast("Reset", "");
}
  
  function setDlProgress(pct, label) {
    if (label) dlLabel.textContent = label;
    if (pct === null) {
      dlTrack.classList.add("indet");
      dlPct.textContent = "…";
    } else {
      dlTrack.classList.remove("indet");
      dlTrack.firstElementChild.style.width = pct + "%";
      dlPct.textContent = Math.round(pct) + "%";
    }
  }

  function fmtBytes(b) {
    if (!b && b !== 0) return "";
    const u = ["B", "KB", "MB", "GB"];
    let i = 0, n = b;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return n.toFixed(n < 10 && i > 0 ? 1 : 0) + " " + u[i];
  }

  function slug(s, max = 30) {
    return (s || "")
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\p{L}\p{N}\s_-]/gu, "")
      .replace(/\s+/g, "_")
      .replace(/_+/g, "_")
      .replace(/^[_\-.]+|[_\-.]+$/g, "")
      .slice(0, max) || "video";
  }

  function stamp(d = new Date()) {
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  function buildFilename(data, ext, kind = "video") {
    const suffix = kind === "thumbnail" ? "_thumb" : "";
    if (data.video_id) {
      return `${data.video_id}${suffix}.${ext}`;
    }
    const user = slug(data.uploader, 20);
    const ts   = stamp();
    return `${user}_${ts}${suffix}.${ext}`;
  }

  function extractUrl(text) {
    const m = (text || "").match(RE_URL);
    return m ? m[0] : "";
  }

async function pasteFromClipboard(e) {
  e.preventDefault(); // stop label from focusing input
  e.stopPropagation();
  
  if (navigator.clipboard?.readText) {
    try {
      const text = await navigator.clipboard.readText();
      const url = extractUrl(text) || (text || "").trim();
      if (!url) { toast("Clipboard is empty", "err"); return; }
      urlInput.value = url;
      urlInput.focus();
      toast("Pasted");
      if (navigator.vibrate) navigator.vibrate(8);
      return;
    } catch (err) {
      console.warn("Clipboard API failed:", err);
    }
  }
  
  urlInput.focus();
  toast("Press and hold to paste", "");
}

$("pasteBtn").addEventListener("click", pasteFromClipboard);
  // ─── extraction (three states) ───────────────────────
  async function extract(rawInput) {
    const url = extractUrl(rawInput) || (rawInput || "").trim();
    if (!url) { toast("Paste a TikTok link first", "err"); return; }

    setLoading(extractBtn, true);

    // state 1 → state 2: skeleton → extracting
    extractPrg.classList.remove("skeleton", "done");
    extractPrg.classList.add("show");
    setExtractStage("Contacting extractor…");

    preview.classList.remove("show");
    preview.classList.add("skeleton");

    try {
      const res = await fetch(EXTRACT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, type: "" }),
      });

      setExtractStage("Parsing response…");
      const data = await res.json();

      if (!res.ok || data.status !== "success") {
        throw new Error(data.error || data.message || `HTTP ${res.status}`);
      }

      setExtractStage("Loading preview…");
      current = data;

      thumbImg.src = data.thumbnail || "";
      thumbImg.alt = data.title || "TikTok thumbnail";
      titleEl.textContent    = data.title || "(no title)";
      uploaderEl.textContent = data.uploader || "unknown";
      platformEl.textContent = data.platform || "tiktok";

      const reveal = () => {
        if (!preview.classList.contains("skeleton")) return;
        preview.classList.add("show");
        preview.classList.remove("skeleton");
        toast("Ready to download", "ok");
        if (navigator.vibrate) navigator.vibrate(12);
      };

      if (thumbImg.complete && thumbImg.naturalWidth > 0) {
        reveal();
      } else {
        thumbImg.onload  = reveal;
        thumbImg.onerror = reveal;
        setTimeout(reveal, 2500);
      }

      // state 2 → state 3: done
      extractPrg.classList.remove("show");
      extractPrg.classList.add("done");

    } catch (err) {
      console.error(err);
      preview.classList.remove("show", "skeleton");
      // back to skeleton for retry
      extractPrg.classList.remove("show", "done");
      extractPrg.classList.add("skeleton");
      toast("Extract failed: " + err.message, "err");
    } finally {
      setLoading(extractBtn, false);
    }
  }

  // ─── video.js modal ──────────────────────────────────
  function openPlayer() {
    if (!current?.stream_url) return;

    const src    = `${STREAM}?url=${encodeURIComponent(current.stream_url)}`;
    const poster = current.thumbnail || "";

    modal.classList.add("show");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.touchAction = "none";

    if (player) { player.dispose(); player = null; }

    player = videojs("player", {
      controls: true,
      autoplay: true,
      preload: "auto",
      fill: true,
      poster,
      playsinline: true,
      sources: [{ src, type: "video/mp4" }],
      controlBar: {
        pictureInPictureToggle: false,
        remainingTimeDisplay: true,
      },
    });

    player.ready(() => {
      player.play().catch(() => {});
    });

    player.on("error", () => {
      toast("Playback failed — try downloading instead", "err");
    });
  }

  function closePlayer() {
    modal.classList.remove("show");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.touchAction = "";
    if (player) {
      try { player.pause(); } catch {}
      player.dispose();
      player = null;
    }
  }

  // ─── download with real progress ─────────────────────
  async function downloadWithProgress(url, filename, useProxy, kind = "video") {
    const target = useProxy
      ? `${STREAM}?url=${encodeURIComponent(url)}`
      : url;

    dlPrg.classList.add("show");
    dlPrg.classList.toggle("magenta", kind === "thumbnail");
    setDlProgress(0, kind === "thumbnail" ? "Downloading thumbnail…" : "Downloading video…");

    let res;
    try {
      res = await fetch(target, { mode: "cors" });
    } catch (e) {
      if (useProxy) {
        console.warn("Proxy failed, falling back:", e);
        return downloadDirect(url, filename);
      }
      throw e;
    }
    if (!res.ok) {
      if (useProxy) return downloadDirect(url, filename);
      throw new Error(`HTTP ${res.status}`);
    }

    let total = Number(res.headers.get("Content-Length")) || 0;
    if (!total) {
      const cr = res.headers.get("Content-Range");
      const m = cr && cr.match(/\/(\d+)$/);
      if (m) total = parseInt(m[1], 10);
    }

    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    let lastTick = performance.now();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;

      const now = performance.now();
      if (now - lastTick > 90) {
        lastTick = now;
        if (total) {
          const pct = Math.min(99.5, (received / total) * 100);
          setDlProgress(pct, `Downloading… ${fmtBytes(received)} / ${fmtBytes(total)}`);
        } else {
          setDlProgress(null, `Downloading… ${fmtBytes(received)}`);
        }
      }
    }

    setDlProgress(100, "Finishing…");

    const blob   = new Blob(chunks, { type: res.headers.get("Content-Type") || "application/octet-stream" });
    const objUrl = URL.createObjectURL(blob);
    triggerSave(objUrl, filename);
    setTimeout(() => URL.revokeObjectURL(objUrl), 4000);

    toast("Saved to device", "ok");
    if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
    setTimeout(() => dlPrg.classList.remove("show"), 900);
  }

  function downloadDirect(url, filename) {
    setDlProgress(null, "Handing off to browser…");
    toast("Browser is downloading (no live progress)", "");
    triggerSave(url, filename);
    setTimeout(() => dlPrg.classList.remove("show"), 2200);
  }

  function triggerSave(href, filename) {
    const a = document.createElement("a");
    a.href = href;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // ─── events ──────────────────────────────────────────
  $("resetBtn").addEventListener("click", reset);
  
  extractBtn.addEventListener("click", () => extract(urlInput.value));

  urlInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      extract(urlInput.value);
      urlInput.blur();
    }
  });

  urlInput.addEventListener("paste", e => {
    const txt = (e.clipboardData || window.clipboardData).getData("text");
    const clean = extractUrl(txt);
    if (clean && clean !== txt) {
      e.preventDefault();
      urlInput.value = clean;
      toast("Link cleaned");
    }
  });

  playBtn.addEventListener("click", openPlayer);

  modal.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) closePlayer();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && modal.classList.contains("show")) closePlayer();
  });

  dlVideo.addEventListener("click", async () => {
    if (!current?.stream_url) return;
    setLoading(dlVideo, true);
    try {
      await downloadWithProgress(
        current.stream_url,
        buildFilename(current, "mp4", "video"),
        true,
        "video"
      );
    } catch (e) {
      console.error(e);
      toast("Download failed: " + e.message, "err");
      dlPrg.classList.remove("show");
    } finally {
      setLoading(dlVideo, false);
    }
  });

  dlThumb.addEventListener("click", async () => {
    if (!current?.thumbnail) return;
    setLoading(dlThumb, true);
    try {
      await downloadWithProgress(
        current.thumbnail,
        buildFilename(current, "jpg", "thumbnail"),
        false,
        "thumbnail"
      );
    } catch (e) {
      console.error(e);
      toast("Thumbnail failed: " + e.message, "err");
      dlPrg.classList.remove("show");
    } finally {
      setLoading(dlThumb, false);
    }
  });

  const param = new URLSearchParams(location.search).get("url");
  if (param) {
    urlInput.value = param;
    extract(param);
  }
})();
</script>
</body>
</html>
